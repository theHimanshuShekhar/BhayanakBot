services:
  # ── Layer 1: Data ──────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: bhayanak_bot_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: bhayanakbot
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bhayanakbot"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - botnet

  # ── Layer 2: Schema (runs after postgres is ready) ────────────
  migrate:
    build:
      context: .
      target: migration
    container_name: bhayanak_bot_migrate
    restart: on-failure
    labels:
      - "dockhand.hidden=true"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/bhayanakbot}
      NODE_ENV: production
    networks:
      - botnet

  # ── Layer 3: Supporting services ──────────────────────────────
  valkey:
    image: valkey/valkey:8-alpine
    container_name: bhayanak_bot_valkey
    restart: unless-stopped
    command: valkey-server --appendonly yes
    volumes:
      - valkeydata:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - botnet

  ollama:
    image: ollama/ollama:latest
    container_name: bhayanak_bot_ollama
    restart: unless-stopped
    volumes:
      - ollamadata:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/11434'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - botnet

  stable-diffusion:
    image: ghcr.io/jim60105/stable-diffusion-webui:latest
    container_name: bhayanak_bot_sd
    restart: unless-stopped
    command: >
      --api --nowebui
      --use-cpu all
      --no-half
      --skip-torch-cuda-test
    ports:
      - "7860:7860"
    volumes:
      - sddata:/stable-diffusion-webui/models
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:7860/sdapi/v1/sd-models || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 120s
    networks:
      - botnet

  # ── Layer 4: Application (depends on everything above) ────────
  bot:
    build:
      context: .
      target: production
    container_name: bhayanak_bot
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      ollama:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-3000}:${WEB_PORT:-3000}"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/bhayanakbot}
      VALKEY_URL: ${VALKEY_URL:-redis://valkey:6379}
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL}
      DISCORD_TOKEN: ${DISCORD_TOKEN}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID}
      SD_URL: ${SD_URL:-http://stable-diffusion:7860}
      NODE_ENV: ${NODE_ENV:-production}
      WEB_PORT: ${WEB_PORT:-3000}
    networks:
      - botnet

networks:
  botnet:
    driver: bridge

volumes:
  pgdata:
  valkeydata:
  ollamadata:
  sddata:
