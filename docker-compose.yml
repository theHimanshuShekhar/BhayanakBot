services:
  # ── Layer 1: Data ──────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: bhayanak_bot_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: bhayanakbot
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bhayanakbot"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - botnet

  # ── Layer 2: Supporting services ──────────────────────────────
  valkey:
    image: valkey/valkey:8-alpine
    container_name: bhayanak_bot_valkey
    restart: unless-stopped
    command: valkey-server --appendonly yes
    volumes:
      - valkeydata:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - botnet

  ollama:
    image: ollama/ollama:latest
    container_name: bhayanak_bot_ollama
    restart: unless-stopped
    volumes:
      - ollamadata:/root/.ollama
    deploy:
      resources:
        limits:
          memory: 4G
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - botnet

  # ── Layer 4: Application (depends on everything above) ────────
  bot:
    build:
      context: .
      target: production
    container_name: bhayanak_bot
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'node.*src/index' || pgrep -f 'tsx.*src/index' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/bhayanakbot}
      VALKEY_URL: ${VALKEY_URL:-redis://valkey:6379}
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL}
      DISCORD_TOKEN: ${DISCORD_TOKEN}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID}
      NODE_ENV: ${NODE_ENV:-production}
      WHISPER_BINARY: ${WHISPER_BINARY:-whisper-cli}
      WHISPER_MODEL: ${WHISPER_MODEL:-/app/models/ggml-base.en.bin}
      PIPER_BINARY: ${PIPER_BINARY:-piper}
      PIPER_MODEL: ${PIPER_MODEL:-/app/models/en_US-lessac-medium.onnx}
    networks:
      - botnet

networks:
  botnet:
    driver: bridge

volumes:
  pgdata:
  valkeydata:
  ollamadata:
