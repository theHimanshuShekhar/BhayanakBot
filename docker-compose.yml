name: bhayanakbot

services:
  # ── Layer 1: Data ──────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: bhayanak_bot_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: bhayanakbot
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bhayanakbot"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - botnet

  # ── Layer 2: Supporting services ──────────────────────────────
  valkey:
    image: valkey/valkey:8-alpine
    container_name: bhayanak_bot_valkey
    restart: unless-stopped
    command: valkey-server --appendonly yes
    volumes:
      - valkeydata:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - botnet

  # ── Layer 4: Application (depends on everything above) ────────
  bot:
    build:
      context: .
      target: production
    container_name: bhayanak_bot
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'node.*dist/index' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/bhayanakbot}
      VALKEY_URL: ${VALKEY_URL:-redis://valkey:6379}
      ZEN_API_KEY: ${ZEN_API_KEY}
      ZEN_ALLOW_DISCORD_CONTENT: ${ZEN_ALLOW_DISCORD_CONTENT:-false}
      ZEN_BASE_URL: ${ZEN_BASE_URL:-https://opencode.ai/zen/go/v1}
      ZEN_MODEL: ${ZEN_MODEL:-deepseek-v4-flash}
      ZEN_TIMEOUT_MS: ${ZEN_TIMEOUT_MS:-30000}
      DISCORD_TOKEN: ${DISCORD_TOKEN}
      BOT_OWNER_ID: ${BOT_OWNER_ID:-}
      TARGET_GUILD_ID: ${TARGET_GUILD_ID:-}
      TARGET_TEXT_CHANNEL_ID: ${TARGET_TEXT_CHANNEL_ID:-}
      GUESS_WHO_CHANNEL_ID: ${GUESS_WHO_CHANNEL_ID:-}
      GUESS_WHO_BACKFILL_LIMIT: ${GUESS_WHO_BACKFILL_LIMIT:-}
      PUBLIC_STATS_INTERVAL_MS: ${PUBLIC_STATS_INTERVAL_MS:-}
      DASHBOARD_PRESENCE_INTERVAL_MS: ${DASHBOARD_PRESENCE_INTERVAL_MS:-}
      YOUTUBE_COOKIE: ${YOUTUBE_COOKIE:-}
      PALWORLD_API_URL: ${PALWORLD_API_URL:-}
      PALWORLD_ADMIN_KEY: ${PALWORLD_ADMIN_KEY:-}
      MINECRAFT_RCON_HOST: ${MINECRAFT_RCON_HOST:-mc}
      MINECRAFT_RCON_PORT: ${MINECRAFT_RCON_PORT:-25575}
      MINECRAFT_RCON_PASSWORD: ${MINECRAFT_RCON_PASSWORD:-}
      NODE_ENV: ${NODE_ENV:-production}
    networks:
      - botnet
      - minecraft

  web:
    build:
      context: .
      target: production
    container_name: bhayanak_bot_web
    restart: unless-stopped
    command: sh -c "pnpm web:build && HOST=0.0.0.0 PORT=4321 node web/dist/server/entry.mjs"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/bhayanakbot}
      PUBLIC_BOT_INVITE_URL: ${PUBLIC_BOT_INVITE_URL:-https://discord.com/oauth2/authorize}
    ports:
      - "${WEB_PORT:-4321}:4321"
    networks:
      - botnet

networks:
  botnet:
    driver: bridge
  minecraft:
    external: true
    name: minecraft_default

volumes:
  pgdata:
    driver: local
    driver_opts:
      type: cifs
      o: "username=${CIFS_USERNAME},password=${CIFS_PASSWORD},uid=70,gid=70,file_mode=0700,dir_mode=0700,iocharset=utf8"
      device: "//10.1.1.195/weyland/Services/bhayanakbot/postgres"
  valkeydata:
