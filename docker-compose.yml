name: bhayanakbot

services:
  # ── Layer 1: Data ──────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: bhayanak_bot_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: bhayanakbot
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bhayanakbot"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - botnet

  # ── Layer 2: Supporting services ──────────────────────────────
  valkey:
    image: valkey/valkey:8-alpine
    container_name: bhayanak_bot_valkey
    restart: unless-stopped
    command: valkey-server --appendonly yes
    volumes:
      - valkeydata:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - botnet

  # Ollama disabled — local LLM infra is switched off in src/lib/features.ts.
  # Uncomment to revive it (also uncomment the bot dependency below).
  # ollama:
  #   image: ollama/ollama:latest
  #   container_name: bhayanak_bot_ollama
  #   restart: unless-stopped
  #   volumes:
  #     - ollamadata:/root/.ollama
  #   deploy:
  #     resources:
  #       limits:
  #         memory: 4G
  #   healthcheck:
  #     test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 10
  #     start_period: 10s
  #   networks:
  #     - botnet

  # ── Layer 4: Application (depends on everything above) ────────
  bot:
    build:
      context: .
      target: production
    container_name: bhayanak_bot
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      # ollama:
      #   condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'node.*dist/index' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/bhayanakbot}
      VALKEY_URL: ${VALKEY_URL:-redis://valkey:6379}
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL}
      OLLAMA_DEBUG_CONTENT_LOGS: ${OLLAMA_DEBUG_CONTENT_LOGS:-false}
      OLLAMA_MAX_QUEUE_LENGTH: ${OLLAMA_MAX_QUEUE_LENGTH:-25}
      OLLAMA_MAX_LOW_PRIORITY_QUEUE_LENGTH: ${OLLAMA_MAX_LOW_PRIORITY_QUEUE_LENGTH:-10}
      OLLAMA_QUEUE_WAIT_TIMEOUT_MS: ${OLLAMA_QUEUE_WAIT_TIMEOUT_MS:-60000}
      ZEN_API_KEY: ${ZEN_API_KEY}
      ZEN_ALLOW_DISCORD_CONTENT: ${ZEN_ALLOW_DISCORD_CONTENT:-false}
      ZEN_BASE_URL: ${ZEN_BASE_URL:-https://opencode.ai/zen/go/v1}
      ZEN_MODEL: ${ZEN_MODEL:-deepseek-v4-flash}
      ZEN_TIMEOUT_MS: ${ZEN_TIMEOUT_MS:-15000}
      DISCORD_TOKEN: ${DISCORD_TOKEN}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID}
      BOT_OWNER_ID: ${BOT_OWNER_ID:-}
      TARGET_GUILD_ID: ${TARGET_GUILD_ID:-}
      PALWORLD_API_URL: ${PALWORLD_API_URL:-}
      PALWORLD_ADMIN_KEY: ${PALWORLD_ADMIN_KEY:-}
      NODE_ENV: ${NODE_ENV:-production}
    networks:
      - botnet

  web:
    build:
      context: .
      target: production
    container_name: bhayanak_bot_web
    restart: unless-stopped
    command: sh -c "pnpm web:build && HOST=0.0.0.0 PORT=4321 node web/dist/server/entry.mjs"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/bhayanakbot}
      PUBLIC_BOT_INVITE_URL: ${PUBLIC_BOT_INVITE_URL:-https://discord.com/oauth2/authorize}
    ports:
      - "${WEB_PORT:-4321}:4321"
    networks:
      - botnet

networks:
  botnet:
    driver: bridge

volumes:
  pgdata:
    driver: local
    driver_opts:
      type: cifs
      o: "username=${CIFS_USERNAME},password=${CIFS_PASSWORD},uid=70,gid=70,file_mode=0700,dir_mode=0700,iocharset=utf8"
      device: "//10.1.1.195/weyland/Services/bhayanakbot/postgres"
  valkeydata:
  ollamadata:
