name: bhayanakbot

services:
  # ── Layer 1: Data ──────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: bhayanak_bot_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: bhayanakbot
      # Pin the server and its client tools to UTC; the schema's timestamps carry no zone.
      TZ: UTC
      PGTZ: UTC
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bhayanakbot"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - botnet

  # ── Layer 2: Application (depends on everything above) ────────
  bot:
    build:
      context: .
      target: bot
    container_name: bhayanak_bot
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # Anchored: the bot is exec'd, so its command line starts with `node dist/index.js`, while this check's own
      # `sh -c` line does not (an unanchored pattern matched the check itself and always passed).
      test: ["CMD-SHELL", "pgrep -f '^node dist/index.js' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/bhayanakbot}
      ZEN_API_KEY: ${ZEN_API_KEY}
      ZEN_ALLOW_DISCORD_CONTENT: ${ZEN_ALLOW_DISCORD_CONTENT:-false}
      ZEN_BASE_URL: ${ZEN_BASE_URL:-https://opencode.ai/inference/go/openai/v1}
      ZEN_MODEL: ${ZEN_MODEL:-deepseek-v4.1-flash}
      ZEN_BACKUP_MODEL: ${ZEN_BACKUP_MODEL:-glm-5.3-flash}
      ZEN_TIMEOUT_MS: ${ZEN_TIMEOUT_MS:-30000}
      DISCORD_TOKEN: ${DISCORD_TOKEN}
      BOT_OWNER_ID: ${BOT_OWNER_ID:-}
      TARGET_GUILD_ID: ${TARGET_GUILD_ID:-}
      TARGET_TEXT_CHANNEL_ID: ${TARGET_TEXT_CHANNEL_ID:-}
      GUESS_WHO_CHANNEL_ID: ${GUESS_WHO_CHANNEL_ID:-}
      GUESS_WHO_BACKFILL_LIMIT: ${GUESS_WHO_BACKFILL_LIMIT:-}
      PUBLIC_STATS_INTERVAL_MS: ${PUBLIC_STATS_INTERVAL_MS:-}
      DASHBOARD_PRESENCE_INTERVAL_MS: ${DASHBOARD_PRESENCE_INTERVAL_MS:-}
      YOUTUBE_COOKIE: ${YOUTUBE_COOKIE:-}
      PALWORLD_API_URL: ${PALWORLD_API_URL:-}
      PALWORLD_ADMIN_KEY: ${PALWORLD_ADMIN_KEY:-}
      MINECRAFT_RCON_HOST: ${MINECRAFT_RCON_HOST:-mc}
      MINECRAFT_RCON_PORT: ${MINECRAFT_RCON_PORT:-25575}
      MINECRAFT_RCON_PASSWORD: ${MINECRAFT_RCON_PASSWORD:-}
      NODE_ENV: ${NODE_ENV:-production}
    networks:
      - botnet
      - minecraft

  web:
    build:
      context: .
      target: web
    container_name: bhayanak_bot_web
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4321/').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    environment:
      # Opt-in: set WEB_DATABASE_URL to the read-only bhayanak_web role (migration 0024) once its password is set.
      DATABASE_URL: ${WEB_DATABASE_URL:-postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/bhayanakbot}
      PUBLIC_BOT_INVITE_URL: ${PUBLIC_BOT_INVITE_URL:-https://discord.com/oauth2/authorize}
      DASHBOARD_API_TOKEN: ${DASHBOARD_API_TOKEN:-}
    ports:
      - "${WEB_PORT:-4321}:4321"
    networks:
      - botnet

networks:
  botnet:
    driver: bridge
  minecraft:
    external: true
    name: minecraft_default

volumes:
  pgdata:
    driver: local
    driver_opts:
      type: cifs
      o: "username=${CIFS_USERNAME},password=${CIFS_PASSWORD},uid=70,gid=70,file_mode=0700,dir_mode=0700,iocharset=utf8"
      device: "//10.1.1.195/weyland/Services/bhayanakbot/postgres"
